[workspace]
resolver = "3"
members = ["crates/mouser", "crates/mouser-mcp"]

[workspace.package]
version = "0.5.0" # x-release-please-version
edition = "2024"
license = "MIT"
repository = "https://github.com/eljefedelrodeodeljefe/mouser-mcp"

[workspace.dependencies]
mouser = { path = "crates/mouser", version = "0.5.0" } # x-release-please-version
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.0"
wiremock = "0.6"
rust_decimal = "1.43.0"
rusty-money = { version = "0.5.1", features = ["iso"] }

# Output goes through `tracing`: stdout carries the MCP JSON-RPC stream.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
