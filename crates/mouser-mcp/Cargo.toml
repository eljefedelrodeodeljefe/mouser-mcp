[package]
name = "mouser-mcp"
description = "MCP server for the Mouser Electronics APIs: part search with live stock and pricing, cart, order history, ordering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "mouser-mcp"
path = "src/main.rs"

[dependencies]
mouser = { workspace = true, features = ["schemars"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "elicitation"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusty-money = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
# the client side of MCP, to drive the server over an in-memory transport in tests
rmcp = { version = "3.9", features = ["client"] }
wiremock = { workspace = true }

[lints]
workspace = true
