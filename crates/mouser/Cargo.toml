[package]
name = "mouser"
description = "Client for the Mouser Electronics APIs: search, cart, order history and ordering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mouser", "electronics", "components", "bom", "api"]
categories = ["api-bindings"]

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true, optional = true }
rust_decimal = { workspace = true }
rusty-money = { workspace = true }
time = { version = "0.3.55", features = ["macros", "parsing", "formatting"] }

[features]
# JSON Schema derives for the request and response types, for callers that expose them as
# tool arguments. Off by default: the library itself needs no schemas.
schemars = ["dep:schemars"]

[dev-dependencies]
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
