name: Release

on:
  # A release published by a person. Releases created by release-please do NOT fire
  # this: events from GITHUB_TOKEN start no workflows. release-please.yml calls this
  # workflow directly instead.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach assets to"
        type: string
        required: true
  # Backfill assets for an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to"
        type: string
        required: true

permissions: {}

# Never cancel — interrupting mid-upload leaves a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build / ${{ matrix.target }}
    # Skip pre-releases (tags with a `-` suffix, e.g. 0.2.0-rc.1).
    if: "!github.event.release.prerelease"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache in a release: a poisoned cache entry would end up in a published binary.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      # Values go through env, never into the script text (template injection).
      - name: Package
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          staging="mouser-mcp-${TAG}-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/mouser-mcp" LICENSE README.md "$staging/"
          tar -czf "dist/$staging.tar.gz" "$staging"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber

  # SBOM for the released version, attached to the release as a durable asset.
  # Informational: a finding must never block a release that has already been published —
  # the weekly gating scan in sbom-scan.yml is where enforcement lives.
  sbom:
    name: SBOM + vulnerability scan
    if: "!github.event.release.prerelease"
    uses: ./.github/workflows/sbom-scan.yml
    permissions:
      contents: write
    with:
      mode: informational
      upload-to-release: ${{ inputs.tag || github.event.release.tag_name }}
